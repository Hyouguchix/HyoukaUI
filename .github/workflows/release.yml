name: Release

# Push a tag like v0.1.1 and this builds HyoukaUI-v0.1.1.zip (folder HyoukaUI inside) and publishes a GitHub release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build zip
        run: |
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p build/HyoukaUI
          git ls-files -z | grep -zv '^\.github/' | grep -zv '^\.gitignore$' | xargs -0 -I{} cp --parents {} build/HyoukaUI/
          # Reproducible zip: fixed file times (tag commit time), sorted names, no extra attributes.
          find build -exec touch -h -d "@$(git log -1 --format=%ct)" {} +
          (cd build && find HyoukaUI -type f | LC_ALL=C sort | zip -X -q "../HyoukaUI-${VERSION}.zip" -@)
          unzip -l "HyoukaUI-${VERSION}.zip" | tail -1

      - name: Release notes
        run: |
          if [ -f ".github/release-notes/${GITHUB_REF_NAME}.md" ]; then
            cp ".github/release-notes/${GITHUB_REF_NAME}.md" notes.md
            exit 0
          fi
          PREV=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          if [ -n "$PREV" ]; then RANGE="$PREV..${GITHUB_REF_NAME}"; else RANGE="${GITHUB_REF_NAME}"; fi
          git log --pretty='- %s' $RANGE > notes.md
          [ -s notes.md ] || echo "- Release ${GITHUB_REF_NAME}" > notes.md

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ZIP="HyoukaUI-${GITHUB_REF_NAME}.zip"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            # Never replace a published asset: the site pins the checksum of the first upload.
            gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name' | grep -qx "$ZIP" || gh release upload "${GITHUB_REF_NAME}" "$ZIP"
            gh release edit "${GITHUB_REF_NAME}" --notes-file notes.md
          else
            gh release create "${GITHUB_REF_NAME}" "$ZIP"               --title "HyoukaUI ${GITHUB_REF_NAME#v}" --notes-file notes.md
          fi
