name: Release

# Push a tag like v0.1.1 and this builds HyoukaUI-v0.1.1.zip (folder HyoukaUI inside) and publishes a GitHub release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build zip
        run: |
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p build/HyoukaUI
          git ls-files -z | grep -zv '^\.github/' | grep -zv '^\.gitignore$' | xargs -0 -I{} cp --parents {} build/HyoukaUI/
          (cd build && zip -qr "../HyoukaUI-${VERSION}.zip" HyoukaUI)
          unzip -l "HyoukaUI-${VERSION}.zip" | tail -1

      - name: Release notes from commits
        run: |
          PREV=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          if [ -n "$PREV" ]; then RANGE="$PREV..${GITHUB_REF_NAME}"; else RANGE="${GITHUB_REF_NAME}"; fi
          git log --pretty='- %s' $RANGE > notes.md
          [ -s notes.md ] || echo "- Release ${GITHUB_REF_NAME}" > notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "HyoukaUI-${GITHUB_REF_NAME}.zip" \
            --title "HyoukaUI ${GITHUB_REF_NAME#v}" --notes-file notes.md
